<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders - ShopEasy Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site" id="navbar"></header>

  <main class="container">
    <div class="subnav" id="subnav"></div>

    <div class="toolbar">
      <select id="filter">
        <option value="">All orders</option>
        <option value="Placed">Placed</option>
        <option value="Shipped">Shipped</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>

    <div id="orders"><p class="muted">Loading...</p></div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    const NEXT = {
      Placed: ['Shipped', 'Cancelled'],
      Shipped: ['Delivered', 'Cancelled'],
      Delivered: [],
      Cancelled: []
    };

    function detailHtml(order, items) {
      const rows = items
        .map(
          (i) => `<tr>
            <td>${escapeHtml(i.name)}</td>
            <td>${i.quantity}</td>
            <td>${formatPrice(i.unit_price)}</td>
            <td>${formatPrice(i.unit_price * i.quantity)}</td>
          </tr>`
        )
        .join('');
      return `
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <p style="margin-top:10px">
          <b>Ship to:</b> ${escapeHtml(order.shipping_name)}, ${escapeHtml(order.shipping_phone)}<br>
          ${escapeHtml(order.shipping_address)}, ${escapeHtml(order.shipping_city)} - ${escapeHtml(order.shipping_pincode)}<br>
          <b>Payment:</b> ${escapeHtml(order.payment_method)}
        </p>`;
    }

    async function load() {
      const box = document.getElementById('orders');
      const status = document.getElementById('filter').value;
      try {
        const { orders } = await api(
          '/admin/orders' + (status ? '?status=' + encodeURIComponent(status) : '')
        );
        if (orders.length === 0) {
          box.innerHTML = '<p class="muted">No orders found.</p>';
          return;
        }
        box.innerHTML = orders
          .map((o) => {
            const options = NEXT[o.status]
              .map((s) => `<option value="${s}">${s}</option>`)
              .join('');
            const controls = options
              ? `<select id="sel-${o.id}">${options}</select>
                 <button class="btn small" data-act="update" data-id="${o.id}">Update status</button>`
              : '<span class="muted">No further action</span>';
            return `
          <div class="order-card">
            <div class="order-head">
              <div>
                <b>Order #${o.id}</b> ${statusBadge(o.status)}<br>
                <span class="muted">${escapeHtml(o.customer_name)} (${escapeHtml(o.customer_email)}) &middot; ${escapeHtml(o.shipping_city)}</span><br>
                <span class="muted">${formatDate(o.created_at)}</span>
              </div>
              <div class="price">${formatPrice(o.total_amount)}</div>
              <div class="row-actions">
                ${controls}
                <button class="btn secondary small" data-act="view" data-id="${o.id}">Details</button>
              </div>
            </div>
            <div class="order-detail" id="detail-${o.id}" hidden></div>
          </div>`;
          })
          .join('');
      } catch (err) {
        box.innerHTML = `<p class="muted">${escapeHtml(err.message)}</p>`;
      }
    }

    document.getElementById('filter').addEventListener('change', load);

    document.getElementById('orders').addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-act]');
      if (!btn) return;
      const id = btn.dataset.id;

      if (btn.dataset.act === 'view') {
        const box = document.getElementById('detail-' + id);
        if (!box.hidden) {
          box.hidden = true;
          return;
        }
        try {
          const { order, items } = await api('/orders/' + id);
          box.innerHTML = detailHtml(order, items);
          box.hidden = false;
        } catch (err) {
          showToast(err.message, 'err');
        }
      }

      if (btn.dataset.act === 'update') {
        const status = document.getElementById('sel-' + id).value;
        if (status === 'Cancelled' && !confirm('Cancel this order? Stock will be restored.')) return;
        try {
          await api('/admin/orders/' + id + '/status', { method: 'PUT', body: { status } });
          showToast('Order marked as ' + status);
          load();
        } catch (err) {
          showToast(err.message, 'err');
        }
      }
    });

    if (requireAdmin()) {
      document.getElementById('subnav').innerHTML = adminNav('orders');
      load();
    }
  </script>
</body>
</html>

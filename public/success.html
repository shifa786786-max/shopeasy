<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order placed - ShopEasy</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site" id="navbar"></header>

  <main class="container">
    <div class="success-box" id="box"><p class="muted">Loading...</p></div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    async function load() {
      const id = new URLSearchParams(window.location.search).get('id');
      const box = document.getElementById('box');
      try {
        const { order, items } = await api('/orders/' + encodeURIComponent(id));
        const rows = items
          .map(
            (i) => `
          <div class="summary-row">
            <span>${escapeHtml(i.name)} &times; ${i.quantity}</span>
            <span>${formatPrice(i.unit_price * i.quantity)}</span>
          </div>`
          )
          .join('');
        box.innerHTML = `
          <div class="tick">&#10003;</div>
          <h2>Order placed successfully!</h2>
          <p style="margin-top:10px">Order ID: <b>#${order.id}</b></p>
          <div style="text-align:left;margin-top:14px">
            ${rows}
            <div class="summary-total"><span>Total (Cash on Delivery)</span><span>${formatPrice(order.total_amount)}</span></div>
          </div>
          <p class="muted" style="margin-top:12px;text-align:left">
            Shipping to: ${escapeHtml(order.shipping_name)}, ${escapeHtml(order.shipping_address)},
            ${escapeHtml(order.shipping_city)} - ${escapeHtml(order.shipping_pincode)}
          </p>
          <div class="actions">
            <a class="btn" href="/orders.html">View my orders</a>
            <a class="btn secondary" href="/index.html">Continue shopping</a>
          </div>`;
        updateCartBadge();
      } catch (err) {
        box.innerHTML = `<p class="muted">${escapeHtml(err.message)}</p>`;
      }
    }

    if (requireLogin()) load();
  </script>
</body>
</html>
